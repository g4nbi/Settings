name: Build Settings Deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot libtinfo5 libz3-dev rsync curl perl unzip git xz-utils

      - name: Set up Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Get iOS toolchain
        run: |
          curl -L https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.1.0/swift-5.6.1-ubuntu20.04.tar.xz \
            | tar -xJ -C $THEOS/toolchain
          ls $THEOS/toolchain/linux/iphone/bin | head

      - name: Get iOS SDK
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p $THEOS/sdks
          cp -r /tmp/sdks/*.sdk $THEOS/sdks/
          rm -rf $THEOS/sdks/iPhoneOS16*.sdk $THEOS/sdks/iPhoneOS17*.sdk $THEOS/sdks/iPhoneOS18*.sdk
          ls $THEOS/sdks

      - name: Build package
        run: make package FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: Settings-deb
          path: packages/*.deb
          if-no-files-found: error
